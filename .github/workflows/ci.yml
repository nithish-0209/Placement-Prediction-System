name: PlacementPredict ML System CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Dataset & Train Pipeline
        run: |
          python data/generate_dataset.py
          python -m models.train_all

      - name: Verify API & Smoke Test
        run: |
          python -c "import app, joblib; print('All modules, pipelines, and artifacts verified!')"
