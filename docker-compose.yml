version: '3.8'

services:
  placement-predict:
    build:
      context: .
      dockerfile: Dockerfile
    image: placement-predict:v1.0
    container_name: placement_prediction_service
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/telemetry"]
      interval: 30s
      timeout: 5s
      retries: 3
